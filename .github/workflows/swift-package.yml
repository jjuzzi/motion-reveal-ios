name: Swift Package

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: Resolve and build
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build
        run: swift build
